name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A787ED: ${{ secrets.A787ED }}
          BFB1BD: ${{ secrets.BFB1BD }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A787ED', '')
          bm = os.environ.get('BFB1BD', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- ca641235685c9fa15010d5e7bf7852669d -->', gm)
          if bm:
              s2 = s2.replace('<!-- 824a94e2ff6fbf19cb3b0716bd827945c5 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
